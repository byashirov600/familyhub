services:
  postgres:
    image: postgres:15
    container_name: familyhub_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: postgres600
      POSTGRES_DB: familyhub_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d familyhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: familyhub_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:postgres600@postgres:5432/familyhub_db
      SECRET_KEY: super_secret_key_for_jwt_change_me
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: familyhub_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
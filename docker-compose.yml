version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: familyhub_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: familyhub_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d familyhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: familyhub_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/familyhub_db
      SECRET_KEY: super_secret_key_for_jwt_change_me
    volumes:
      - ./uploads:/app/uploads  # Чтобы картинки сохранялись на хосте
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: